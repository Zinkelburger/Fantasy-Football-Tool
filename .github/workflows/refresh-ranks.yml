# Refreshes ESPN/Sleeper/FFC market ranks twice a week and commits the
# result. If the repo is connected to Cloudflare Pages, the push triggers a
# redeploy automatically, so foss.football stays current with zero manual
# work. Season note: bump the cron to daily in the two weeks before Labor
# Day — that's when ADP moves fastest.
#
# Optional: delete this file if you'd rather run `python3 update_ranks.py`
# by hand before drafts.
name: refresh-ranks

on:
  schedule:
    - cron: "0 11 * * 2,5"   # Tue + Fri, 11:00 UTC
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh ranks from public APIs
        run: python3 update_ranks.py
      - name: Commit if anything moved
        run: |
          git config user.name "rank-refresh-bot"
          git config user.email "actions@github.com"
          git add go/*.csv league-sim/data/market/adp_2026.csv
          git diff --cached --quiet && echo "no ADP movement" && exit 0
          git commit -m "data: refresh ESPN/Sleeper/FFC ranks ($(date -u +%F))"
          git push
