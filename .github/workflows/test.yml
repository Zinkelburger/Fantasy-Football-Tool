name: Website tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install weekly engine test dependencies
        run: python -m pip install -r engine/weekly/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
