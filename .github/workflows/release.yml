name: Release (Unified)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Install Fyne tools
      run: |
        go install fyne.io/tools/cmd/fyne@latest
        go install github.com/fyne-io/fyne-cross@latest

    - name: Build Linux
      working-directory: go
      run: |
        # Generate Fyne resources from assets
        fyne bundle -o resource.go logo.png
        fyne bundle -o font_resource.go font/JetBrainsMonoNL-Regular.ttf
        
        # Create release directory
        mkdir -p releases
        
        # Build Linux targets using fyne-cross
        echo "Building Linux amd64..."
        fyne-cross linux -arch=amd64 --app-id football.draftassistant --name fantasy-football-tool
        
        echo "Building Linux arm64..."
        fyne-cross linux -arch=arm64 --app-id football.draftassistant --name fantasy-football-tool
        
        # Create proper release packages with all required files
        echo "=== Packaging Linux builds with all required files ==="
        
        # Package amd64 build
        if [ -d "fyne-cross/dist/linux-amd64" ]; then
          echo "Packaging Linux amd64..."
          mkdir -p releases/linux-amd64
          cp -r fyne-cross/dist/linux-amd64/* releases/linux-amd64/ || echo "No amd64 binary files to copy"
          
          # Add all required data files
          cp -r analysis releases/linux-amd64/
          cp players.csv releases/linux-amd64/
          cp -r prompts releases/linux-amd64/
          cp -r font releases/linux-amd64/
          cp README.md releases/linux-amd64/
          
          # Create final archive
          cd releases
          tar -czf fantasy-football-tool-linux-amd64.tar.gz -C linux-amd64 .
          cd ..
        fi
        
        # Package arm64 build
        if [ -d "fyne-cross/dist/linux-arm64" ]; then
          echo "Packaging Linux arm64..."
          mkdir -p releases/linux-arm64
          cp -r fyne-cross/dist/linux-arm64/* releases/linux-arm64/ || echo "No arm64 binary files to copy"
          
          # Add all required data files
          cp -r analysis releases/linux-arm64/
          cp players.csv releases/linux-arm64/
          cp -r prompts releases/linux-arm64/
          cp -r font releases/linux-arm64/
          cp README.md releases/linux-arm64/
          
          # Create final archive
          cd releases
          tar -czf fantasy-football-tool-linux-arm64.tar.gz -C linux-arm64 .
          cd ..
        fi
        
        echo "=== Linux Build Results ==="
        ls -la releases/
        echo "Contents of amd64 package:"
        tar -tzf releases/fantasy-football-tool-linux-amd64.tar.gz | head -20 || echo "No amd64 archive found"

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-builds
        path: go/releases/

  build-windows:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Install Fyne tools
      run: |
        go install fyne.io/tools/cmd/fyne@latest
        go install github.com/fyne-io/fyne-cross@latest

    - name: Build Windows
      working-directory: go
      run: |
        # Generate Fyne resources from assets
        fyne bundle -o resource.go logo.png
        fyne bundle -o font_resource.go font/JetBrainsMonoNL-Regular.ttf
        
        # Create release directory
        mkdir -p releases
        
        # Build Windows targets using fyne-cross
        echo "Building Windows amd64..."
        fyne-cross windows -arch=amd64 --app-id football.draftassistant --name fantasy-football-tool
        
        # Create proper release packages with all required files
        echo "=== Packaging Windows builds with all required files ==="
        
        # Package amd64 build
        if [ -d "fyne-cross/dist/windows-amd64" ]; then
          echo "Packaging Windows amd64..."
          mkdir -p releases/windows-amd64
          cp -r fyne-cross/dist/windows-amd64/* releases/windows-amd64/ || echo "No Windows binary files to copy"
          
          # Add all required data files
          cp -r analysis releases/windows-amd64/
          cp players.csv releases/windows-amd64/
          cp -r prompts releases/windows-amd64/
          cp -r font releases/windows-amd64/
          cp README.md releases/windows-amd64/
          
          # Create final archive with consistent structure (files at root level)
          cd releases
          (cd windows-amd64 && zip -r ../fantasy-football-tool-windows-amd64.zip .)
          cd ..
        fi
        
        echo "=== Windows Build Results ==="
        ls -la releases/
        echo "Contents of Windows package:"
        unzip -l releases/fantasy-football-tool-windows-amd64.zip | head -20 || echo "No Windows archive found"

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-builds
        path: go/releases/

  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Install Fyne tools
      run: go install fyne.io/tools/cmd/fyne@latest

    - name: Build and Package macOS App
      working-directory: go
      run: |
        # Ensure the newly installed fyne tool is in the PATH
        export PATH=$(go env GOPATH)/bin:$PATH
        
        # Generate Fyne resources
        fyne bundle -o resource.go logo.png
        fyne bundle -o font_resource.go font/JetBrainsMonoNL-Regular.ttf

        # Mac looks for icon.png
        cp logo.png Icon.png
        
        # Create a directory for the final release assets
        mkdir -p releases
        
        # --- Function to package a specific architecture ---
        package_macos_arch() {
          ARCH=$1
          echo "Building and packaging for macOS/$ARCH..."

          # Build the application
          GOARCH=$ARCH fyne package --os darwin --app-id football.draftassistant --name "fantasy-football-tool" --icon logo.png

          # For macOS app bundles, we need to put data files where the app can find them
          # Since the app looks for files in the current directory, we create a package structure
          # that includes both the .app and the data files at the same level
          mkdir -p "darwin-$ARCH"
          mv "fantasy-football-tool.app" "darwin-$ARCH/"
          
          # Copy all required data files next to the .app bundle
          echo "Copying data files next to the app bundle..."
          cp -r analysis prompts font players.csv README.md "darwin-$ARCH/"
          
          # Create the final archive
          tar -czf "releases/fantasy-football-tool-darwin-$ARCH.tar.gz" -C "darwin-$ARCH" .
          
          # Clean up for the next build
          rm -rf "darwin-$ARCH"
        }
        
        # --- Build and package for both architectures ---
        package_macos_arch amd64
        package_macos_arch arm64

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-builds
        path: go/releases/

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure of downloaded files
      run: ls -la artifacts/

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        
        # Copy all build artifacts to release assets directory
        find artifacts/ -name "*.tar.gz" -exec cp {} release-assets/ \;
        find artifacts/ -name "*.zip" -exec cp {} release-assets/ \;
        
        echo "Release assets prepared:"
        ls -la release-assets/

    - name: Extract version from tag
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: Release ${{ steps.get_version.outputs.version }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          release-assets/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}