name: Release (Unified)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Install dependencies for AppImage
      run: |
        sudo apt-get update
        sudo apt-get install -y libfuse2 file libgl1-mesa-dev xorg-dev

    - name: Install Fyne tools
      run: |
        go install fyne.io/tools/cmd/fyne@latest

    - name: Build Linux AppImage
      working-directory: go
      run: |
        # Generate Fyne resources from assets
        fyne bundle -o resource.go logo.png
        fyne bundle -o font_resource.go font/JetBrainsMonoNL-Regular.ttf
        
        # Create release directory
        mkdir -p releases
        
        # Build the Linux binary
        echo "Building Linux binary..."
        CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o fantasy-football-tool .
        
        # Create AppDir structure
        echo "Creating AppImage structure..."
        mkdir -p AppDir/usr/bin
        mkdir -p AppDir/usr/share/fantasy-football-tool
        mkdir -p AppDir/usr/share/applications
        mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
        
        # Copy binary
        cp fantasy-football-tool AppDir/usr/bin/
        
        # Copy data files
        cp -r analysis AppDir/usr/share/fantasy-football-tool/
        cp players.csv AppDir/usr/share/fantasy-football-tool/
        cp -r prompts AppDir/usr/share/fantasy-football-tool/
        cp -r font AppDir/usr/share/fantasy-football-tool/
        
        # Copy icon
        cp logo.png AppDir/usr/share/icons/hicolor/256x256/apps/fantasy-football-tool.png
        cp logo.png AppDir/fantasy-football-tool.png
        
        # Create desktop file
        cat > AppDir/fantasy-football-tool.desktop << EOF
        [Desktop Entry]
        Type=Application
        Name=Fantasy Football Tool
        Comment=AI-powered fantasy football draft assistant
        Exec=fantasy-football-tool
        Icon=fantasy-football-tool
        Categories=Game;Sports;
        EOF
        
        cp AppDir/fantasy-football-tool.desktop AppDir/usr/share/applications/
        
        # Create AppRun script
        cat > AppDir/AppRun << 'EOF'
        #!/bin/bash
        HERE="$(dirname "$(readlink -f "${0}")")"
        export PATH="${HERE}/usr/bin:${PATH}"
        export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
        cd "${HERE}/usr/share/fantasy-football-tool"
        exec "${HERE}/usr/bin/fantasy-football-tool" "$@"
        EOF
        chmod +x AppDir/AppRun
        
        # Download appimagetool
        wget -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool
        
        # Build AppImage
        echo "Building AppImage..."
        ./appimagetool AppDir releases/fantasy-football-tool-x86_64.AppImage
        
        echo "=== Linux Build Results ==="
        ls -la releases/
        file releases/fantasy-football-tool-x86_64.AppImage

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-builds
        path: go/releases/*.AppImage

  build-windows:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Install Fyne tools
      run: |
        go install fyne.io/tools/cmd/fyne@latest
        go install github.com/fyne-io/fyne-cross@latest

    - name: Build Windows
      working-directory: go
      run: |
        # Generate Fyne resources from assets
        fyne bundle -o resource.go logo.png
        fyne bundle -o font_resource.go font/JetBrainsMonoNL-Regular.ttf
        
        # Create release directory
        mkdir -p releases
        
        # Build Windows targets using fyne-cross
        echo "Building Windows amd64..."
        fyne-cross windows -arch=amd64 --app-id football.draftassistant --name fantasy-football-tool
        
        # Create clean Windows package structure
        echo "=== Packaging Windows build with clean structure ==="
        
        if [ -d "fyne-cross/dist/windows-amd64" ]; then
          echo "Creating clean Windows package..."
          mkdir -p releases/windows-package
          
          # Copy the exe directly to the package root
          cp fyne-cross/dist/windows-amd64/*.exe releases/windows-package/ || echo "No exe found"
          
          # Copy all data files to package root
          cp -r analysis releases/windows-package/
          cp players.csv releases/windows-package/
          cp -r prompts releases/windows-package/
          cp -r font releases/windows-package/
          cp README.md releases/windows-package/
          
          # Create single zip with everything at root level
          cd releases
          zip -r fantasy-football-tool-windows-amd64.zip windows-package/*
          cd ..
          
          echo "Package structure:"
          ls -la releases/windows-package/
        fi
        
        echo "=== Windows Build Results ==="
        ls -la releases/
        echo "Contents of Windows package:"
        unzip -l releases/fantasy-football-tool-windows-amd64.zip | head -20 || echo "No Windows archive found"

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-builds
        path: go/releases/

  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Install Fyne tools
      run: go install fyne.io/tools/cmd/fyne@latest

    - name: Build and Package macOS App
      working-directory: go
      run: |
        # Ensure the newly installed fyne tool is in the PATH
        export PATH=$(go env GOPATH)/bin:$PATH
        
        # Generate Fyne resources
        fyne bundle -o resource.go logo.png
        fyne bundle -o font_resource.go font/JetBrainsMonoNL-Regular.ttf

        # Mac looks for icon.png
        cp logo.png Icon.png
        
        # Create a directory for the final release assets
        mkdir -p releases
        
        # --- Function to package a specific architecture ---
        package_macos_arch() {
          ARCH=$1
          echo "Building and packaging for macOS/$ARCH..."

          # Build the application
          GOARCH=$ARCH fyne package --os darwin --app-id football.draftassistant --name "fantasy-football-tool" --icon logo.png

          # Create a proper Mac package structure
          mkdir -p "darwin-$ARCH"
          
          # Put data files inside the app bundle's Resources directory
          echo "Embedding data files inside the app bundle..."
          mkdir -p "fantasy-football-tool.app/Contents/Resources"
          cp -r analysis "fantasy-football-tool.app/Contents/Resources/"
          cp players.csv "fantasy-football-tool.app/Contents/Resources/"
          cp -r prompts "fantasy-football-tool.app/Contents/Resources/"
          cp -r font "fantasy-football-tool.app/Contents/Resources/"
          
          # Move the complete app bundle to the package directory
          mv "fantasy-football-tool.app" "darwin-$ARCH/"
          
          # Add README at the package level (outside the app)
          cp README.md "darwin-$ARCH/"
          
          # Create user-friendly ZIP file instead of tar.gz
          cd darwin-$ARCH
          zip -r "../releases/fantasy-football-tool-darwin-$ARCH.zip" .
          cd ..
          
          # Clean up for the next build
          rm -rf "darwin-$ARCH"
        }
        
        # --- Build and package for both architectures ---
        package_macos_arch amd64
        package_macos_arch arm64

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-builds
        path: go/releases/

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure of downloaded files
      run: ls -la artifacts/

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        
        # Copy all build artifacts to release assets directory
        find artifacts/ -name "*.zip" -exec cp {} release-assets/ \;
        find artifacts/ -name "*.AppImage" -exec cp {} release-assets/ \;
        
        echo "Release assets prepared:"
        ls -la release-assets/

    - name: Extract version from tag
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: Release ${{ steps.get_version.outputs.version }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          release-assets/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}