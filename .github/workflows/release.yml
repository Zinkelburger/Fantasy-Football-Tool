name: Release (Unified)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-20.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev xorg-dev build-essential

    - name: Install packaging tools
      run: |
        sudo apt-get install -y dpkg-dev rpm alien

    - name: Install Fyne tools
      run: |
        go install fyne.io/tools/cmd/fyne@latest

    - name: Build binary and create packages
      working-directory: go
      run: |
        # Generate Fyne resources from assets
        fyne bundle -o resource.go logo.png
        fyne bundle -o font_resource.go font/JetBrainsMonoNL-Regular.ttf
        
        # Build the Linux binary
        echo "Building Linux binary..."
        CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o fantasy-football-tool .
        
        # Create package build directory
        mkdir -p build/deb/DEBIAN
        mkdir -p build/deb/usr/bin
        mkdir -p build/deb/usr/share/fantasy-football-tool
        mkdir -p build/deb/usr/share/applications
        mkdir -p build/deb/usr/share/icons/hicolor/256x256/apps
        mkdir -p build/deb/var/lib/fantasy-football-tool/status
        
        # Copy binary
        cp fantasy-football-tool build/deb/usr/bin/
        
        # Copy read-only data files to /usr/share/
        cp -r analysis build/deb/usr/share/fantasy-football-tool/
        cp players.csv build/deb/usr/share/fantasy-football-tool/
        cp -r prompts build/deb/usr/share/fantasy-football-tool/
        cp -r font build/deb/usr/share/fantasy-football-tool/
        cp README.md build/deb/usr/share/fantasy-football-tool/
        
        # Copy icon and desktop file from dist/
        cp logo.png build/deb/usr/share/icons/hicolor/256x256/apps/fantasy-football-tool.png
        cp ../dist/fantasy-football-tool.desktop build/deb/usr/share/applications/
        
        # Create control file from template
        sed 's/{{VERSION}}/1.0.0/g' ../dist/debian/control.template > build/deb/DEBIAN/control
        
        # Copy debian scripts
        cp ../dist/debian/postinst build/deb/DEBIAN/
        cp ../dist/debian/postrm build/deb/DEBIAN/
        chmod 755 build/deb/DEBIAN/postinst build/deb/DEBIAN/postrm
        
        # Build .deb package
        mkdir -p releases
        dpkg-deb --build build/deb releases/fantasy-football-tool_1.0.0_amd64.deb
        
        # Convert .deb to .rpm using alien
        cd releases
        sudo alien --to-rpm --scripts fantasy-football-tool_1.0.0_amd64.deb
        
        # Rename RPM to follow standard naming
        mv *.rpm fantasy-football-tool-1.0.0-1.x86_64.rpm
        cd ..
        
        echo "=== Package Build Results ==="
        ls -la releases/
        echo ""
        echo "DEB package info:"
        dpkg-deb --info releases/fantasy-football-tool_1.0.0_amd64.deb
        echo ""
        echo "Binary dependencies:"
        ldd fantasy-football-tool | head -10

    - name: Upload Linux packages
      uses: actions/upload-artifact@v4
      with:
        name: linux-packages
        path: |
          go/releases/*.deb
          go/releases/*.rpm

  build-windows:
    runs-on: windows-latest  # Use a native Windows runner
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Install Fyne tools
      run: go install fyne.io/tools/cmd/fyne@latest

    - name: Build and Package Windows App
      working-directory: go
      shell: pwsh # Use PowerShell, the standard for Windows runners
      run: |
        # Ensure the Fyne tool is available in the current shell's PATH
        $env:Path += ";$(go env GOPATH)\bin"

        # Generate Fyne resources from assets
        Write-Host "Generating Fyne resources..."
        fyne bundle -o resource.go logo.png
        if (-not $?) { throw "Failed to bundle logo.png" }
        
        fyne bundle -o font_resource.go font/JetBrainsMonoNL-Regular.ttf
        if (-not $?) { throw "Failed to bundle font resource" }

        # Use 'fyne package' to create a distributable .exe with its icon and manifest
        # This is the standard way to build a Fyne app for distribution
        Write-Host "Building Windows executable..."
        fyne package -os windows --app-id football.draftassistant --name "fantasy-football-tool" --icon logo.png
        if (-not $?) { throw "Failed to build Windows executable" }

        # Verify the executable was created
        if (-not (Test-Path "fantasy-football-tool.exe")) {
          throw "Expected fantasy-football-tool.exe was not created"
        }

        # --- Create a clean package structure for the ZIP file ---
        Write-Host "=== Packaging Windows build ==="
        
        # Create releases directory and staging directory
        New-Item -ItemType Directory -Force -Path ".\releases"
        $stagingDir = ".\releases\windows-package"
        New-Item -ItemType Directory -Force -Path $stagingDir

        # Copy the .exe and all necessary assets to the staging directory
        Write-Host "Copying files to staging directory..."
        Copy-Item -Path ".\fantasy-football-tool.exe" -Destination $stagingDir -ErrorAction Stop
        Copy-Item -Path ".\analysis" -Destination $stagingDir -Recurse -ErrorAction Stop
        Copy-Item -Path ".\players.csv" -Destination $stagingDir -ErrorAction Stop
        Copy-Item -Path ".\prompts" -Destination $stagingDir -Recurse -ErrorAction Stop
        Copy-Item -Path ".\font" -Destination $stagingDir -Recurse -ErrorAction Stop
        Copy-Item -Path ".\README.md" -Destination $stagingDir -ErrorAction Stop
        
        # Create the final ZIP file from the contents of the staging directory
        Write-Host "Creating ZIP archive..."
        Compress-Archive -Path "$stagingDir\*" -DestinationPath ".\releases\fantasy-football-tool-windows-amd64.zip" -Force

        Write-Host "Package structure:"
        Get-ChildItem -Path $stagingDir
        
        Write-Host "=== Windows Build Results ==="
        Get-ChildItem -Path ".\releases\"

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-builds
        path: go/releases/*.zip

  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Install Fyne tools
      run: go install fyne.io/tools/cmd/fyne@latest

    - name: Build and Package macOS App
      working-directory: go
      run: |
        # Ensure the newly installed fyne tool is in the PATH
        export PATH=$(go env GOPATH)/bin:$PATH
        
        # Generate Fyne resources
        fyne bundle -o resource.go logo.png
        fyne bundle -o font_resource.go font/JetBrainsMonoNL-Regular.ttf

        # Mac looks for icon.png
        cp logo.png Icon.png
        
        # Create a directory for the final release assets
        mkdir -p releases
        
        # --- Function to package a specific architecture ---
        package_macos_arch() {
          ARCH=$1
          echo "Building and packaging for macOS/$ARCH..."

          # Build the application
          GOARCH=$ARCH fyne package --os darwin --app-id football.draftassistant --name "fantasy-football-tool" --icon logo.png

          # Create a proper Mac package structure
          mkdir -p "darwin-$ARCH"
          
          # Put data files inside the app bundle's Resources directory
          echo "Embedding data files inside the app bundle..."
          mkdir -p "fantasy-football-tool.app/Contents/Resources"
          cp -r analysis "fantasy-football-tool.app/Contents/Resources/"
          cp players.csv "fantasy-football-tool.app/Contents/Resources/"
          cp -r prompts "fantasy-football-tool.app/Contents/Resources/"
          cp -r font "fantasy-football-tool.app/Contents/Resources/"
          
          # Move the complete app bundle to the package directory
          mv "fantasy-football-tool.app" "darwin-$ARCH/"
          
          # Add README at the package level (outside the app)
          cp README.md "darwin-$ARCH/"
          
          # Create user-friendly ZIP file instead of tar.gz
          cd darwin-$ARCH
          zip -r "../releases/fantasy-football-tool-darwin-$ARCH.zip" .
          cd ..
          
          # Clean up for the next build
          rm -rf "darwin-$ARCH"
        }
        
        # --- Build and package for both architectures ---
        package_macos_arch amd64
        package_macos_arch arm64

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-builds
        path: go/releases/

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure of downloaded files
      run: |
        echo "Downloaded artifacts:"
        find artifacts/ -type f -name "*.deb" -o -name "*.rpm" -o -name "*.zip" | sort
        echo ""
        echo "Detailed structure:"
        ls -la artifacts/*/

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        
        # Copy all build artifacts to release assets directory
        find artifacts/ -name "*.zip" -exec cp {} release-assets/ \;
        find artifacts/ -name "*.deb" -exec cp {} release-assets/ \;
        find artifacts/ -name "*.rpm" -exec cp {} release-assets/ \;
        
        # Create simple installation guide
        cat > release-assets/INSTALL_GUIDE.md << 'EOF'
        # Fantasy Football Tool - Installation Guide
        
        ## Quick Install
        
        ### Ubuntu/Debian (Recommended):
        ```bash
        # Download and install the .deb package
        wget https://github.com/your-repo/releases/latest/download/fantasy-football-tool_1.0.0_amd64.deb
        sudo dpkg -i fantasy-football-tool_1.0.0_amd64.deb
        sudo apt-get install -f  # Fix any missing dependencies
        
        # Run from anywhere
        fantasy-football-tool
        ```
        
        ### CentOS/RHEL/Fedora:
        ```bash
        # Download and install the .rpm package
        wget https://github.com/your-repo/releases/latest/download/fantasy-football-tool-1.0.0-1.x86_64.rpm
        sudo rpm -i fantasy-football-tool-1.0.0-1.x86_64.rpm
        # or on newer systems:
        sudo dnf install ./fantasy-football-tool-1.0.0-1.x86_64.rpm
        
        # Run from anywhere
        fantasy-football-tool
        ```
        
        ### Windows:
        1. Download `fantasy-football-tool-windows-amd64.zip`
        2. Extract and run `fantasy-football-tool.exe`
        
        ### macOS:
        1. Download the appropriate ZIP for your Mac:
           - Intel Macs: `fantasy-football-tool-darwin-amd64.zip`
           - Apple Silicon: `fantasy-football-tool-darwin-arm64.zip`
        2. Extract and run the app
        
        ## Package Benefits
        
        ✅ **Automatic dependency resolution** - Package manager installs required libraries  
        ✅ **System integration** - Desktop shortcut and proper uninstall  
        ✅ **Easy updates** - Use package manager to upgrade  
        ✅ **No file extraction needed** - Just install and run  
        
        ## Dependencies (automatically handled by packages)
        
        The Linux packages declare these dependencies:
        - libc6 (>= 2.31) - Standard C library
        - libgl1-mesa-glx - OpenGL graphics
        - libx11-6, libxrandr2, libxinerama1, libxcursor1, libxi6 - X11 windowing
        
        ## Uninstall
        
        ### Ubuntu/Debian:
        ```bash
        sudo apt remove fantasy-football-tool
        ```
        
        ### CentOS/RHEL/Fedora:
        ```bash
        sudo rpm -e fantasy-football-tool
        # or: sudo dnf remove fantasy-football-tool
        ```
        EOF
        
        echo "Release assets prepared:"
        ls -la release-assets/

    - name: Extract version from tag
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: Release ${{ steps.get_version.outputs.version }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          release-assets/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}