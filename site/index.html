<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- the browser extension's handshake: it only injects its bridge on
       pages that claim to be ours (see chrome-extension/bridge.js) -->
  <meta name="ff-draft-assistant" content="1">
  <title>FOSS Football</title>
  <!-- The four lines below are the only reader-facing text outside
       site/copy.md. They have to be in the HTML because search engines
       and link previews read them before any script runs. -->
  <meta name="description" content="Fantasy football rankings and draft tools. Every ranking comes from a model tested against eight seasons of real results, and the code, the data and the methods are public.">
  <meta property="og:title" content="FOSS Football">
  <meta property="og:description" content="Fantasy football rankings and draft tools, tested against eight seasons of real results.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header">
    <a class="brand" href="#/">
      <span class="brand-dot"></span> <span data-copy-text="site.name">FOSS Football</span>
    </a>
    <!-- Three destinations, because there are three things you can be
         doing: reading what we found, looking at your own league, or
         drafting right now. Everything we publish is one section with
         tabs (#section-tabs below) rather than five peer nav entries,
         which is what this row used to be. -->
    <nav id="site-nav">
      <a href="#/plan" data-route="plan" data-copy-text="nav.guide">Rankings &amp; research</a>
      <a href="#/live" data-route="live" data-copy-text="nav.live">My league</a>
      <a href="#/draft" data-route="draft" class="nav-draft"
         data-copy-text="nav.draft">Draft tool</a>
    </nav>
  </header>

  <main id="main">

    <!-- The tab row for the "Rankings & research" section. Hidden on
         every view outside it; the router decides. -->
    <nav id="section-tabs" class="section-tabs" hidden>
      <a href="#/plan" data-sect="plan" data-copy-text="tab.plan"></a>
      <a href="#/board" data-sect="board" data-copy-text="tab.board"></a>
      <a href="#/weekly" data-sect="weekly" data-copy-text="tab.weekly"></a>
      <a href="#/blog" data-sect="blog" data-copy-text="tab.blog"></a>
      <a href="#/models" data-sect="models" data-copy-text="tab.models"></a>
    </nav>

    <!-- ============================================= HOME
         Every view starts hidden: the router unhides the right one once
         copy.json has landed, so no page flashes its empty slots. -->
    <!-- The home page's job is to say what this site is and what is on
         it, in sentences. It used to be a headline and seven buttons,
         which told a first-time reader nothing about any of them. -->
    <section id="view-home" class="view" hidden>
      <div class="hero">
        <h1 data-copy-text="home.title"></h1>
        <div class="lede" data-copy="home.lede"></div>
      </div>

      <h2 data-copy-text="home.whats-here"></h2>

      <div class="feature">
        <h3><a href="#/plan" data-copy-text="home.f.plan.title"></a></h3>
        <div data-copy="home.f.plan.body"></div>
      </div>

      <div class="feature">
        <h3><a href="#/board" data-copy-text="home.f.kdst.title"></a></h3>
        <div data-copy="home.f.kdst.body"></div>
      </div>

      <div class="feature">
        <h3><a href="#/blog" data-copy-text="home.f.research.title"></a></h3>
        <div data-copy="home.f.research.body"></div>
      </div>

      <div class="feature">
        <h3><a href="#/live" data-copy-text="home.f.league.title"></a></h3>
        <div data-copy="home.f.league.body"></div>
      </div>

      <div class="feature">
        <h3><a href="#/draft" data-copy-text="home.f.tool.title"></a></h3>
        <div data-copy="home.f.tool.body"></div>
      </div>

      <h2 data-copy-text="home.how.title"></h2>
      <div class="lede" data-copy="home.how.body"></div>
    </section>

    <!-- ============================================= WEEKLY -->
    <section id="view-weekly" class="view" hidden>
      <div class="view-head">
        <h2 data-copy-text="weekly.title"></h2>
        <span id="weekly-label" class="dim"></span>
      </div>
      <div class="tabs" id="weekly-tabs">
        <button data-tab="dst" class="tab pos-dst active"
                data-copy-text="weekly.tab.dst"></button>
        <button data-tab="k" class="tab pos-k"
                data-copy-text="weekly.tab.k"></button>
        <button data-tab="skill" class="tab"
                data-copy-text="weekly.tab.skill"></button>
      </div>

      <div class="board-tools" id="weekly-tools">
        <input id="weekly-search" type="search"
               data-copy-placeholder="weekly.search"
               data-copy-aria="weekly.search.label">
        <button id="weekly-hide-taken" class="mini-btn" aria-pressed="false"
                data-copy-title="weekly.hide-taken.tip"
                data-copy-text="weekly.hide-taken"></button>
        <button id="weekly-clear" class="mini-btn"
                data-copy-title="weekly.clear.tip"
                data-copy-text="weekly.clear"></button>
      </div>

      <div id="weekly-dst" class="tab-pane">
        <div class="blurb" data-copy="weekly.dst.blurb"></div>
        <details class="note">
          <summary data-copy-text="weekly.dst.note.title"></summary>
          <div data-copy="weekly.dst.note.body"></div>
        </details>
        <div class="tbl"><table id="dst-table"></table></div>
      </div>

      <div id="weekly-k" class="tab-pane" hidden>
        <div class="blurb" data-copy="weekly.k.blurb"></div>
        <div class="tbl"><table id="k-table"></table></div>
      </div>

      <div id="weekly-skill" class="tab-pane" hidden>
        <div class="blurb" data-copy="weekly.skill.blurb"></div>
        <div class="tabs skill-controls">
          <span id="skill-pos" class="tabs">
            <button data-pos="QB" class="tab pos-qb">QB</button>
            <button data-pos="RB" class="tab pos-rb active">RB</button>
            <button data-pos="WR" class="tab pos-wr">WR</button>
            <button data-pos="TE" class="tab pos-te">TE</button>
          </span>
          <span id="skill-fmt" class="tabs scoring">
            <button data-fmt="std" class="tab">Std</button>
            <button data-fmt="half" class="tab active">Half</button>
            <button data-fmt="ppr" class="tab">PPR</button>
          </span>
        </div>
        <details class="note">
          <summary data-copy-text="weekly.skill.note.title"></summary>
          <div data-copy="weekly.skill.note.body"></div>
        </details>
        <div class="tbl"><table id="skill-table"></table></div>
        <div id="skill-empty" class="empty-state" hidden>
          <h3 data-copy-text="weekly.skill.title"></h3>
          <div data-copy="weekly.skill.body"></div>
        </div>
      </div>
    </section>

    <!-- ============================================= BOARD -->
    <section id="view-board" class="view" hidden>
      <div class="view-head">
        <h2 data-copy-text="board.title"></h2>
        <div class="dim" data-copy="board.subtitle"></div>
      </div>

      <div class="blurb" data-copy="board.blurb"></div>

      <!-- Both lists at once: they are two picks made together, and the
           tables are narrow enough to sit side by side. -->
      <div class="board-cols">
        <section>
          <h3 data-copy-text="board.k.title"></h3>
          <div class="blurb" data-copy="board.k.blurb"></div>
          <div class="tbl"><table id="pre-k-table"></table></div>
        </section>

        <section>
          <h3 data-copy-text="board.dst.title"></h3>
          <div class="blurb" data-copy="board.dst.blurb"></div>
          <div class="tbl"><table id="pre-dst-table"></table></div>
        </section>
      </div>
    </section>

    <!-- ============================================= MODELS -->
    <section id="view-models" class="view" hidden>
      <div class="view-head">
        <h2 data-copy-text="models.title"></h2>
        <span class="dim" data-copy-text="models.subtitle"></span>
      </div>
      <article class="post" data-copy="models.body"></article>
      <div class="dim" data-copy="models.source"></div>
    </section>

    <!-- ============================================= BLOG -->
    <section id="view-blog" class="view" hidden>
      <div class="view-head">
        <h2 data-copy-text="blog.title"></h2>
        <span class="dim" data-copy-text="blog.subtitle"></span>
      </div>
      <details id="glossary" class="note">
        <summary data-copy-text="blog.glossary.title"></summary>
        <div data-copy="blog.glossary.body"></div>
      </details>
      <div id="blog-list"></div>
    </section>

    <section id="view-post" class="view" hidden>
      <a class="back" href="#/blog" data-copy-text="blog.back"></a>
      <article id="post-body" class="post"></article>
    </section>

    <!-- ============================================ MY LEAGUE -->
    <section id="view-live" class="view" hidden>
      <h1 data-copy-text="live.title"></h1>

      <div id="live-connect" class="live-connect">
        <!-- Filled in by the extension when it can see your ESPN
             leagues, which makes the box below unnecessary. -->
        <div id="live-found" class="live-found" hidden></div>

        <label for="live-id" data-copy-text="live.field.label"></label>
        <div class="live-connect-row">
          <input id="live-id" type="text" spellcheck="false" autocomplete="off"
                 data-copy-placeholder="live.field.placeholder">
          <button id="live-go" class="btn primary" type="button"
                  data-copy-text="live.connect"></button>
        </div>
        <p id="live-hint" class="live-hint dim"></p>

        <div id="live-leagues" class="live-leagues" hidden></div>
        <p id="live-error" class="load-error" hidden></p>

        <details class="live-help">
          <summary data-copy-text="live.help.title"></summary>
          <div data-copy="live.help.body"></div>
        </details>
      </div>

      <div id="live-picked" class="live-picked" hidden>
        <span id="live-picked-name" class="live-picked-name"></span>
        <span class="dim"><span data-copy-text="live.via"></span>
          <span id="live-source"></span></span>
        <button id="live-switch" class="btn small" type="button"
                data-copy-text="live.switch"></button>
      </div>

      <nav id="league-tabs" class="league-tabs" hidden>
        <a href="#/live" data-tab="matchup" data-copy-text="live.tab.matchup"></a>
        <a href="#/live/startsit" data-tab="startsit"
           data-copy-text="live.tab.startsit"></a>
        <a href="#/live/waivers" data-tab="waivers"
           data-copy-text="live.tab.waivers"></a>
        <a href="#/live/teams" data-tab="teams" data-copy-text="live.tab.teams"></a>
        <a href="#/live/review" data-tab="review"
           data-copy-text="live.tab.review"></a>
        <a href="#/live/moves" data-tab="moves" data-copy-text="live.tab.moves"></a>
      </nav>

      <div id="live-body"></div>
      <div id="league-body"></div>
    </section>

    <!-- ========================================== DRAFT PLAN
         One plan, three scoring formats. The rules are the same
         objects in all three; what changes is which body text each one
         shows and whether it is flagged as changing at all. See
         site/plan.md. -->
    <section id="view-plan" class="view" hidden>
      <div class="view-head">
        <h2 data-copy-text="plan.title"></h2>
      </div>
      <div class="blurb" data-copy="plan.intro"></div>

      <div class="scoring">
        <span class="scoring-label" data-copy-text="plan.scoring.label"></span>
        <div class="tabs" id="plan-formats">
          <button class="tab" data-fmt="std" data-copy-text="fmt.std"></button>
          <button class="tab" data-fmt="half" data-copy-text="fmt.half"></button>
          <button class="tab" data-fmt="ppr" data-copy-text="fmt.ppr"></button>
        </div>
      </div>
      <p id="plan-fmt-note" class="dim"></p>

      <!-- The label carries a count, so the renderer fills it rather
           than Copy.apply — otherwise it flashes a raw {n}. -->
      <label class="plan-filter">
        <input type="checkbox" id="plan-changed-only">
        <span></span>
      </label>

      <div id="plan-body"></div>
    </section>

    <!-- ============================================= DRAFT -->
    <!-- No exit affordance on purpose: the draft tool is full-screen and the
         draft is locked in once you're in it. An "✕ exit" in the corner of a
         live draft reads as "close this" — the one thing you never want to
         hit mid-pick. Leaving is closing the tab (or browser back). -->
    <section id="view-draft" class="view" hidden>
      <iframe id="draft-frame" data-copy-title="draft.frame"></iframe>
    </section>

  </main>

  <footer id="site-footer">
    <span>FOSS Football
      <a class="gh-link" href="https://github.com/Zinkelburger/Fantasy-Football-Tool"
         target="_blank" rel="noopener"
         data-copy-title="link.github" data-copy-aria="link.github">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      </a></span>
  </footer>

  <script src="copy.js"></script>
  <script src="sleeper.js"></script>
  <script src="espn.js"></script>
  <script src="provider.js"></script>
  <script src="live.js"></script>
  <script src="league.js"></script>
  <script src="app.js"></script>
</body>
</html>
